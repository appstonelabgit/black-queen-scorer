name: scorewise
description: "Fast offline score tracker for trick-taking team card games."
publish_to: 'none'
version: 1.2.1+12

environment:
  sdk: ^3.3.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  share_plus: ^11.0.0
  screenshot: ^3.0.0
  phosphor_flutter: ^2.1.0
  intl: ^0.20.2
  characters: ^1.3.0
  package_info_plus: ^8.1.1

  # Firebase + ads + live sharing
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.7
  firebase_remote_config: ^5.1.7
  apsl_ads:
    git:
      url: https://github.com/appstonelabgit/shubh_panchang_ads.git
      ref: main
  qr_flutter: ^4.1.0
  app_links: ^6.3.2
  app_tracking_transparency: ^2.0.7

# path_provider_foundation >=2.5.0 pulls the `objective_c` FFI package, which
# builds through Flutter's experimental native-assets path. On iOS that build
# omits the simulator SDK (`Target native_assets required define SdkRoot`),
# embedding the device slice of objective_c.framework and crashing the app on
# the simulator with `incompatible platform (have 'iOS', need 'iOS-simulator')`.
# Pin to 2.4.1 (last release before the objective_c dependency) to avoid it.
dependency_overrides:
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#4338CA"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#4338CA"
  image: "assets/icon/splash.png"
  color_dark: "#4338CA"
  image_dark: "assets/icon/splash.png"
  android_12:
    image: "assets/icon/splash_android12.png"
    color: "#4338CA"
    image_dark: "assets/icon/splash_android12.png"
    color_dark: "#4338CA"
    branding: "assets/icon/branding.png"
  android: true
  ios: true
  fullscreen: false
