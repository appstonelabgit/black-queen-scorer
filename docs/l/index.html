<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Watch live — Black Queen Scorer</title>
  <meta name="description" content="Follow a live card-night session on Black Queen Scorer. Install the app to join with a session code." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="../icon.png" />
  <style>
    :root {
      --emerald: #0F5132;
      --emerald-deep: #0A1F1A;
      --gold: #E8B931;
      --cream: #FAF7F2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 20% 10%, rgba(232,185,49,0.08), transparent 50%),
        linear-gradient(180deg, var(--emerald) 0%, var(--emerald-deep) 100%);
      line-height: 1.6;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .crest {
      display: inline-block;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--gold), #D4A017);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin: 0 0 0.5rem;
    }
    h1 em { color: var(--gold); font-style: normal; }
    p { margin: 0.6rem 0; }
    .muted { opacity: 0.75; }
    .code {
      margin: 2rem auto;
      max-width: 320px;
      padding: 1rem 1.25rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(232,185,49,0.35);
      border-radius: 14px;
      font-size: 1.4rem;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--gold);
    }
    .store-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    .store-badge {
      display: inline-flex;
      align-items: center;
    }
    .store-badge img {
      width: auto;
      display: block;
    }
    /* Google's badge ships with ~12% internal padding — size it taller so
       the visible artwork matches Apple's edge-to-edge badge. */
    #androidLink img { height: 60px; }
    #iosLink img { height: 44px; }
    footer {
      padding: 1.5rem;
      opacity: 0.6;
      font-size: 0.85rem;
      text-align: center;
    }
    footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="crest">
      <svg viewBox="0 0 24 24" fill="none" width="44" height="44" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l4 4-1.5 1.5-1 1v2l2 2c2 2 3 4 3 6 0 2.5-2 4-4 4-1 0-2-.5-2.5-1.5V21h-.0L10 21v-.5C9.5 21.5 8.5 22 7.5 22c-2 0-4-1.5-4-4 0-2 1-4 3-6l2-2v-2l-1-1L8 6l4-4z" fill="#0A1F1A"/></svg>
    </div>
    <h1>Watch <em>Live</em></h1>
    <p class="muted">Your friend is hosting a card-night session on Black Queen Scorer.</p>
    <div class="code" id="code">—</div>
    <p class="muted">Install the app, open it, tap <strong>Watch a live game</strong> on the home screen, and enter the code above.</p>
    <div class="store-row">
      <a class="store-badge" id="androidLink" href="https://play.google.com/store/apps/details?id=com.scorewise.cardscorer&referrer=utm_source%3Dlive_share%26utm_medium%3Dqr%26utm_campaign%3Dv1">
        <img alt="Get it on Google Play"
             src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" />
      </a>
      <a class="store-badge" id="iosLink" href="https://apps.apple.com/app/black-queen-scorer/id6762565568">
        <img alt="Download on the App Store"
             src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" />
      </a>
    </div>
  </main>
  <footer>
    <a href="../">Black Queen Scorer</a> · <a href="../privacy.html">Privacy</a>
  </footer>
  <script>
    (function () {
      // Code lives in the path: /l/XXXX-XXXX (Vercel rewrites it to this
      // page). Fall back to ?code= for older query-style links.
      var segs = location.pathname.split('/').filter(Boolean);
      var fromPath = segs.length > 1 && segs[0] === 'l' ? segs[1] : '';
      var fromQuery = new URLSearchParams(location.search).get('code') || '';
      var code = (fromPath || fromQuery).toUpperCase();
      if (code) document.getElementById('code').textContent = code;
      // Try to open the native app via the App Link the moment the
      // page loads. If the app is installed, iOS/Android usually
      // intercepts BEFORE we ever get here, so this is a best-effort
      // nudge for edge cases (e.g. referrer-stripped shares).
      if (code) {
        setTimeout(function () {
          location.href = 'bqs://live/' + code;
        }, 200);
      }
    })();
  </script>
</body>
</html>
